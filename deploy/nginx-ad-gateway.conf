# Public HTTPS endpoint serves only the three fixed read-only Gateway routes.
server {
    listen 80;
    listen [::]:80;
    server_name identity-risk.46.101.134.38.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/identity-risk-gateway;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name identity-risk.46.101.134.38.sslip.io;
    ssl_certificate /etc/letsencrypt/live/identity-risk.46.101.134.38.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/identity-risk.46.101.134.38.sslip.io/privkey.pem;
    client_max_body_size 1k;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location / { return 404; }
}
